# -----------------------------------------------------------------------------
# Streamlit theme configuration
# -----------------------------------------------------------------------------
# Applied globally to every page. Overrides Streamlit defaults.
# Values chosen for the Smart Hospital Analytics dashboard.

[theme]
base = "dark"
primaryColor = "#00d4ff"
backgroundColor = "#0a0e1a"
secondaryBackgroundColor = "#1e2232"
textColor = "#F0F2F6"
font = "sans serif"

[server]
headless = true
runOnSave = true

[browser]
gatherUsageStats = false